  <!-- ====================== FINDS: what he digs up (together.js, src/main/gifts.js) ====================== -->
  <main class="view view-finds" id="findsView">
    <div class="view-head">
      <h2 class="sr-only">Finds</h2>
      <nav class="seg shellby-tabs" aria-label="Shellby">
        <button type="button" data-goto="wardrobe">Outfits</button>
        <button type="button" data-goto="trophies">Trophies</button>
        <button type="button" data-goto="crew">Crew</button>
        <button type="button" data-goto="stickers">Stickers <span class="n st-count"></span><i class="dot-badge st-badge" hidden></i></button>
        <button type="button" aria-current="page" data-goto="finds">Finds <span class="n fd-count"></span></button>
        <button type="button" data-goto="bugdex">Bugdex <span class="n bd-count"></span><i class="dot-badge bd-badge" hidden></i></button>
        <button type="button" data-goto="tank">Tank <i class="dot-badge tk-badge" hidden></i></button>
        <button type="button" data-goto="us">Us</button>
        <button type="button" data-goto="beach">Beach <i class="dot-badge bc-badge" hidden></i></button>
      </nav>
    </div>
    <section class="fd-hero" aria-label="The shelf">
      <div class="fd-fav" id="fdFav"></div>
      <div class="fd-hero-text">
        <p class="xp-eyebrow fd-eyebrow">The shelf</p>
        <h3 id="fdTotal">Nothing on the shelf yet</h3>
        <p class="fd-sub">When he's bored he digs at your wallpaper, and now and then he turns something up. Some only show up in their season, after dark, or on a special day.</p>
        <div class="fd-tools">
          <button type="button" class="btn primary slim-btn" id="fdDig">Dig for treasure</button>
          <span class="fd-dig-note muted small" id="fdDigNote"></span>
        </div>
      </div>
    </section>
    <section class="ev-banner" data-ev-banner="finds" hidden aria-label="Tide event"></section>
    <ul class="fd-sets" id="fdSets" aria-label="Sets"></ul>
    <section class="fd-detail" id="fdDetail" hidden aria-live="polite"></section>
    <ul class="fd-grid" id="fdGrid" role="list" aria-label="Every find"></ul>
  </main>
