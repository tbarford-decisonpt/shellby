  <!-- ====================== SKILL SHOP ====================== -->
  <main class="view view-shop" id="shopView">
    <div class="view-head">
      <button type="button" class="back-btn" id="shopBack">← Toolbox</button>
      <h2>Skill Shop</h2>
      <button type="button" class="btn ghost slim-btn" id="shopRefresh" title="Fetch the latest plugin lists">Refresh</button>
    </div>
    <p class="view-lede">Skills, agents and commands from Claude Code plugin marketplaces. Installed plugins are ready in new conversations.</p>
    <div class="shop-suggest" id="shopSuggest" hidden></div>
    <div class="toolbox-controls">
      <input type="search" id="shopSearch" class="field" placeholder="Search plugins…" aria-label="Search plugins">
      <div class="seg" id="shopTabs" role="tablist" aria-label="Show" data-roving>
        <button type="button" role="tab" data-filter="all" aria-selected="true">Browse <span class="n"></span></button>
        <button type="button" role="tab" data-filter="installed">Installed <span class="n"></span></button>
      </div>
      <select class="field" id="shopMarket" aria-label="Marketplace"></select>
    </div>
    <ul class="tool-list" id="shopList"></ul>
    <details class="shop-add">
      <summary>Add a marketplace</summary>
      <form class="row" id="shopAddForm">
        <input type="text" class="field" id="shopAddInput" placeholder="owner/repo or https://…" aria-label="Marketplace GitHub repo or URL" spellcheck="false">
        <button type="submit" class="btn slim-btn">Add</button>
      </form>
      <p class="muted small">Anyone can publish a marketplace. Only add ones you trust.</p>
    </details>
  </main>
