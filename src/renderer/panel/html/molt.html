  <!-- the Molt sheet: molting at level 99 (molt.js, src/main/molting.js) -->
  <div class="molt-sheet" id="moltSheet" role="dialog" aria-modal="true" aria-labelledby="moltTitle" hidden>
    <div class="molt-inner">
      <button type="button" class="icon-btn molt-close" id="moltClose" aria-label="Close the Molt sheet">✕</button>
      <p class="molt-eyebrow" id="moltEyebrow">The Molt</p>
      <h2 class="molt-title" id="moltTitle">The Molt</h2>
      <div class="molt-stage" id="moltStage" aria-hidden="true">
        <div class="molt-crab" id="moltCrab"></div>
        <div class="molt-old" id="moltOld"></div>
        <span class="molt-stamp" id="moltStamp"></span>
      </div>
      <p class="molt-shell-name" id="moltShellName"></p>
      <p class="molt-text" id="moltText"></p>
      <ul class="molt-keeps" aria-label="What he keeps">
        <li>Every title, badge, shell, decor piece and perk</li>
        <li>His Bugdex, tank, trophies, stickers and quests</li>
        <li>All his XP and his streak</li>
      </ul>
      <p class="molt-sub" id="moltTiersHead" hidden>His tier shells</p>
      <ul class="molt-tiers" id="moltTiers" aria-label="Tier shells"></ul>
      <div class="molt-actions">
        <button type="button" class="btn primary" id="moltGo">Molt</button>
        <button type="button" class="btn ghost" id="moltLater">Not yet</button>
      </div>
    </div>
  </div>
