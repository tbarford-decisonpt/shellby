  <!-- ====================== HISTORY ====================== -->
  <main class="view view-history" id="historyView">
    <nav class="seg auto-switch" aria-label="History">
      <button type="button" aria-current="page">Conversations</button>
      <button type="button" data-goto-view="time">Time</button>
    </nav>
    <div class="view-head">
      <h2>History</h2>
    </div>
    <input type="search" id="historySearch" class="field" placeholder="Search conversations…" aria-label="Search conversations">
    <!-- Shown in place of the filter row while you're looking at Recently deleted. -->
    <div class="history-bin-bar" id="historyBinBar" hidden>
      <button type="button" class="btn ghost" id="historyBinBack">← Conversations</button>
      <span class="muted small">Deleted chats go for good after 30 days.</span>
      <button type="button" class="btn ghost deny" id="historyBinEmpty">Empty bin</button>
    </div>
    <!-- Hidden until you've ticked something off: nothing to filter before that. -->
    <div class="seg history-tabs" id="historyTabs" role="tablist" aria-label="Show conversations" data-roving hidden>
      <button type="button" role="tab" data-filter="todo" aria-selected="true">Not done <span class="n"></span></button>
      <button type="button" role="tab" data-filter="done" aria-selected="false">Done <span class="n"></span></button>
      <button type="button" role="tab" data-filter="all" aria-selected="false">All <span class="n"></span></button>
    </div>
    <ul class="history-list" id="historyList"></ul>
    <!-- Inside the messages (history-search.js): shown once the search box has something in it. -->
    <section class="history-found" id="historyFound" aria-labelledby="historyFoundHead" hidden>
      <h3 class="history-found-head" id="historyFoundHead">In messages</h3>
      <div class="history-found-filters">
        <select class="field" id="historyFoundProject" aria-label="Project"><option value="">Every project</option></select>
        <select class="field" id="historyFoundPc" aria-label="Computer"><option value="*">Every PC</option><option value="">This PC</option></select>
        <select class="field" id="historyFoundWhen" aria-label="When">
          <option value="">Any time</option>
          <option value="7">Past week</option>
          <option value="30">Past month</option>
          <option value="365">Past year</option>
        </select>
      </div>
      <ul class="history-list history-found-list" id="historyFoundList" aria-live="polite"></ul>
    </section>
    <!-- One quiet row under the list: the way into the bin, where it's kept, and the way to wipe it. -->
    <footer class="history-foot">
      <button type="button" class="btn ghost history-bin-open" id="historyBinOpen" hidden>Recently deleted <span class="n"></span></button>
      <p class="muted small history-note">Stored only on this PC.</p>
      <button type="button" class="btn ghost deny history-clear" id="historyClear" hidden>Clear all history</button>
    </footer>
  </main>
