  <!-- ====================== TOOLBOX ====================== -->
  <main class="view view-toolbox" id="toolboxView">
    <div class="view-head">
      <h2>Toolbox</h2>
      <button type="button" class="btn ghost slim-btn" id="rescanBtn" title="Scan again">Rescan</button>
      <button type="button" class="btn primary slim-btn" id="shopBtn" title="Browse and install skills from Claude Code plugin marketplaces">Get more</button>
    </div>
    <p class="view-lede">What Claude Code can use, and the setup behind every conversation. Anything Shellby builds for itself comes first, tagged <span class="new-pill">new</span>.</p>
    <div class="toolbox-controls">
      <div class="seg tool-groups" id="toolGroups" role="tablist" aria-label="Section" data-roving>
        <button type="button" role="tab" data-group="tools" aria-selected="true">Tools</button>
        <button type="button" role="tab" data-group="setup" title="Hooks, permission rules and memory files">Setup</button>
        <button type="button" role="tab" data-group="lean" title="What every conversation carries before your first word, and what sits idle">Lean <span class="n"></span></button>
        <button type="button" role="tab" data-group="team" title="This repo's team pack: .shellby/team.json">Team <span class="n"></span></button>
      </div>
      <div class="kind-chips" id="toolTabs" role="tablist" aria-label="Kind" data-roving>
        <button type="button" role="tab" data-kind="tool" aria-selected="true">All <span class="n"></span></button>
        <button type="button" role="tab" data-kind="skill">Skills <span class="n"></span></button>
        <button type="button" role="tab" data-kind="agent">Agents <span class="n"></span></button>
        <button type="button" role="tab" data-kind="command">Commands <span class="n"></span></button>
        <button type="button" role="tab" data-kind="mcp">MCP <span class="n"></span></button>
        <button type="button" role="tab" data-kind="mod" title="Code that runs inside every Claude Code conversation">Mods <span class="n"></span></button>
        <button type="button" role="tab" data-kind="snippet" title="Saved prompts: /name here, shellby do @name in a terminal">Snippets <span class="n"></span></button>
        <button type="button" role="tab" data-kind="hook" hidden>Hooks <span class="n"></span></button>
        <button type="button" role="tab" data-kind="rule" title="Permission rules: allow, ask, deny" hidden>Rules <span class="n"></span></button>
        <button type="button" role="tab" data-kind="memory" hidden>Memory <span class="n"></span></button>
      </div>
      <div class="tool-find">
        <input type="search" id="toolSearch" class="field" placeholder="Search skills…" aria-label="Search skills">
        <select class="field" id="toolSource" aria-label="Where they come from"></select>
        <select class="field" id="toolSort" aria-label="Order">
          <option value="name">A to Z</option>
          <option value="used">Most used</option>
          <option value="unused">Unused first</option>
        </select>
      </div>
    </div>
    <div class="setup-pane" id="setupPane" hidden></div>
    <ul class="tool-list" id="toolList"></ul>
  </main>
