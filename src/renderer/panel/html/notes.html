  <!-- ====================== NOTES ====================== -->
  <main class="view view-notes" id="notesView">
    <div class="view-head">
      <h2>Notes</h2>
      <select class="field slim notes-scope" id="notesScope" aria-label="Which list"></select>
    </div>
    <p class="view-lede">Things you'd like to do. When you're ready, have Claude plan one, build it, or tell you whether it's worth doing.</p>
    <form class="note-add" id="noteAdd">
      <textarea class="field area" id="noteInput" rows="2" maxlength="2000" placeholder="Add a note… (Enter to save, Shift+Enter for a new line)" aria-label="New note"></textarea>
      <button type="submit" class="btn primary slim-btn">Add</button>
    </form>
    <p class="notes-where" id="notesWhere"></p>
    <ul class="note-list" id="noteList"></ul>
  </main>
