  <!-- ====================== LOGBOOK ====================== -->
  <!-- every game system on one page, each card linked to its screen (logbook.js, main/logbook.js) -->
  <main class="view view-logbook" id="logbookView">
    <div class="view-head">
      <h2 class="sr-only">Logbook</h2>
      <nav class="seg shellby-tabs" aria-label="Shellby">
        <button type="button" aria-current="page" data-goto="logbook">Logbook</button>
        <button type="button" data-goto="wardrobe">Outfits</button>
        <button type="button" data-goto="trophies">Trophies</button>
        <button type="button" data-goto="crew">Crew</button>
        <button type="button" data-goto="council">Council</button>
        <button type="button" data-goto="stickers">Stickers <span class="n st-count"></span><i class="dot-badge st-badge" hidden></i></button>
        <button type="button" data-goto="finds">Finds <span class="n fd-count"></span><i class="dot-badge fd-badge" hidden></i></button>
        <button type="button" data-goto="bugdex">Bugdex <span class="n bd-count"></span><i class="dot-badge bd-badge" hidden></i></button>
        <button type="button" data-goto="tank">Tank <i class="dot-badge tk-badge" hidden></i></button>
        <button type="button" data-goto="us">Us <i class="dot-badge bc-badge" hidden></i></button>
      </nav>
    </div>
    <p class="muted small lb-intro">What’s going on, what to do next, and what each thing leads to. Every card opens its screen.</p>
    <p class="view-lede newcomer-only" id="lbNewcomer">Just starting? First steps on the chat’s start screen come first. This page fills up as you two work.</p>
    <div class="lb-cards" id="lbCards" aria-live="polite"></div>
    <section class="lb-chapters" id="lbChapters" aria-labelledby="lbChaptersHead" tabindex="-1">
      <h3 id="lbChaptersHead">Quest line <span class="muted small" id="lbChapterCount"></span></h3>
      <ol class="lb-chapter-list" id="lbChapterList"></ol>
    </section>
  </main>
