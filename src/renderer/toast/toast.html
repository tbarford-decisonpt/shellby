<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
<title>Shellby</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="toast.css">
</head>
<body>
  <div class="toast" id="toast" role="status" aria-labelledby="title" aria-describedby="body">
    <span class="crab" id="crab" aria-hidden="true"></span>
    <div class="text">
      <h1 id="title"></h1>
      <p id="body"></p>
    </div>
    <button type="button" class="close" id="close" aria-label="Dismiss">×</button>
    <span class="timer" id="timer" aria-hidden="true"></span>
  </div>
<script src="../shared/sprite.js"></script>
<script src="toast.js"></script>
</body>
</html>
