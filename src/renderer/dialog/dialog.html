<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Shellby</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="dialog.css">
</head>
<body>
  <div class="dialog" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="title" aria-describedby="message">
    <header class="bar">
      <span class="crab" id="crab" aria-hidden="true"></span>
      <span class="app">Shellby</span>
    </header>
    <div class="content">
      <div class="badge" id="badge" aria-hidden="true"></div>
      <h1 id="title"></h1>
      <p id="message"></p>
      <div id="preview" class="preview" hidden></div>
      <p id="detail" class="detail"></p>
      <p id="note" class="note" hidden></p>
    </div>
    <footer class="actions" id="actions"></footer>
  </div>
<script src="../shared/sprite.js"></script>
<script src="dialog.js"></script>
</body>
</html>
