name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here publishes or writes to the repository.
permissions:
  contents: read

# A new push to a PR makes the run for the old one pointless. main keeps every
# run (each commit there gets its own result).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # What ships to users, not the dev tooling: a high-severity advisory in a
      # runtime dependency fails the build.
      - run: npm audit --omit=dev --audit-level=high

  # The only automated coverage the renderer and main's wiring get: each check
  # launches the real app and drives it over CDP with the fake Claude CLI. Its
  # own job, so a renderer regression and a failing unit test surface together
  # rather than one hiding behind the other.
  #
  # The checks run one at a time on a machine (they share hook ports), so they
  # are split across six shards that take about as long, by each check's time
  # in scripts/e2e-times.json (scripts/e2e-ci.js --shard; refresh the times
  # with scripts/e2e-times.js). fail-fast on: the first red shard cancels the
  # others, since the failure is the answer and the rest only burns runner
  # time before the fix. (A step calling `gh run cancel` instead marked the
  # red shard itself "cancelled", hiding which one broke.)
  e2e:
    name: e2e (${{ matrix.shard }}/6)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm ci on a clean runner doesn't always leave Electron's binary behind
      # (it's a postinstall download, not a package file), and these checks launch
      # the real app. Idempotent: it exits immediately when the binary is there.
      - run: node node_modules/electron/install.js
      - run: npm run e2e:ci -- --shard=${{ matrix.shard }}/6

  # "Shellby made this slower": cold start, panel open, his share of a reply's
  # latency, idle CPU and memory, each against scripts/perf-budgets.js (~4 min).
  # Its own job beside e2e, so it adds no time to it, and never two Electrons
  # measuring at once. The numbers are kept as an artifact whatever happens:
  # they're how the budgets get tightened once the runner's real figures are known.
  perf:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run perf -- --out perf-result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: perf-result
          path: perf-result.json
          if-no-files-found: warn
