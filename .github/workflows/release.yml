name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # SignPath fetches the unsigned exes from this run's artifacts.
  actions: read

# One release run per tag. If a tag is moved and pushed again, the run for the
# old commit is cancelled instead of racing the new one (in 0.21.1 the stale run
# published an empty release as "latest").
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `secrets` is not one of the contexts allowed in an `if:` expression, so
      # the winget steps below test this instead. Reading it here is what lets
      # them stay opt-in.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      # Same trick for SignPath: set means the release is signed by SignPath.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Before spending 20 minutes building: the tag matches package.json, still
      # points at this commit, and has no published release that electron-builder
      # would quietly skip uploading to. See scripts/release-guard.js.
      - name: Check the tag before building
        run: node scripts/release-guard.js preflight
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The release is the one build real people install: the UI checks run here
      # too, not just on pull requests.
      # npm ci on a clean runner doesn't always leave Electron's binary behind
      # (it's a postinstall download, not a package file), and these checks launch
      # the real app. Idempotent: it exits immediately when the binary is there.
      - run: node node_modules/electron/install.js
      - run: npm run e2e:ci

      # Create the draft release first. electron-builder uploads installer,
      # portable, blockmap and latest.yml in parallel, and if none exists yet
      # each upload races to create its own draft.
      - name: Create draft release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "Shellby ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md

      # Code signing is opt-in, through one of two services (docs/SIGNING.md):
      # - Azure Artifact Signing (Trusted Signing): electron-builder signs the
      #   installer and the app mid-build and uploads as usual.
      # - SignPath (free for open source): the build stays local, the steps
      #   below send the installer and portable exe to SignPath, and the signed
      #   files are uploaded after.
      # With neither configured the build is unsigned, as before.
      - name: Build and upload
        id: build
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          # The preflight guard already checked the tag is v + package.json's version.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          args=()
          publish=always
          if [ -n "$SIGN_ENDPOINT" ] && [ -n "$SIGNPATH_ORG" ]; then
            echo "::error::Both Azure and SignPath signing are configured. Remove one set of variables (see docs/SIGNING.md)."
            exit 1
          elif [ -n "$SIGNPATH_ORG" ]; then
            if [ -z "$SIGNPATH_API_TOKEN" ]; then
              echo "::error::SIGNPATH_ORGANIZATION_ID is set but the SIGNPATH_API_TOKEN secret isn't."
              exit 1
            fi
            echo "Building for SignPath; the signed files are uploaded after signing."
            publish=never
          elif [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$SIGN_ENDPOINT" ] && [ -n "$SIGN_ACCOUNT" ] && [ -n "$SIGN_PROFILE" ] && [ -n "$SIGN_PUBLISHER" ]; then
            echo "Signing with Azure Artifact Signing ($SIGN_PUBLISHER)"
            args=(
              "-c.win.azureSignOptions.endpoint=$SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$SIGN_PROFILE"
              "-c.win.azureSignOptions.publisherName=$SIGN_PUBLISHER"
            )
          else
            echo "::warning::No code signing credentials configured; this release is unsigned (see docs/SIGNING.md)."
          fi
          npx electron-builder --win --publish "$publish" "${args[@]}"

      # SignPath: hand the two downloadable exes over. Those are what SmartScreen
      # judges; the app inside the installer never carries a download mark, so
      # it isn't checked. SignPath pulls the artifact from this run itself, which
      # is how it knows the files were built here from the tagged source.
      - name: Collect the exes for SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exes
          path: |
            dist/Shellby-Setup-*.exe
            dist/Shellby-Portable-*.exe
          if-no-files-found: error
          retention-days: 1

      # Waits for someone to approve the request on signpath.io (the email
      # arrives as this starts), up to an hour.
      - name: Sign with SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        # Pinned to a commit, not the tag: this action gets the API token and
        # hands back the files we publish, so a moved tag mustn't change it.
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        timeout-minutes: 70
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'shellby' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.build.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed

      # Put the signed exes in place, bring latest.yml and the blockmap in line
      # with the signed installer (scripts/signed-update-info.js), then attach
      # everything to the draft, which the Azure/unsigned build did itself.
      - name: Upload the signed files
        if: ${{ env.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp "dist/signed/Shellby-Setup-$v.exe" "dist/signed/Shellby-Portable-$v.exe" dist/
          node scripts/signed-update-info.js
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "dist/Shellby-Setup-$v.exe" "dist/Shellby-Setup-$v.exe.blockmap" \
            "dist/Shellby-Portable-$v.exe" dist/latest.yml

      # Checksums for anyone verifying a download (SmartScreen or not).
      - name: Upload SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum Shellby-Setup-*.exe Shellby-Portable-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber

      # When signing is on, fail loudly if the result isn't signed, or is signed
      # by anyone but the expected publisher. The draft stays unpublished.
      - name: Check signatures
        if: ${{ vars.AZURE_SIGN_ENDPOINT != '' || vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'SignPath Foundation' || vars.AZURE_SIGN_PUBLISHER }}
        run: |
          foreach ($f in Get-ChildItem dist\Shellby-*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} ({2})" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
            $cn = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($cn -ne $env:EXPECTED_PUBLISHER) { throw "$($f.Name) is signed by '$cn', not '$env:EXPECTED_PUBLISHER'" }
          }

      # Publish only once every file is attached, so auto-update never sees a
      # release without latest.yml: the guard checks the draft has the
      # installer, portable, blockmap, checksums and a latest.yml for this
      # version, and that the tag hasn't moved while this run was building.
      - name: Check the draft before publishing
        run: node scripts/release-guard.js verify
      - name: Publish release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      # Keep the winget package in step with the release, so
      # `winget install x-salmon.Shellby` isn't stuck on an old version.
      #
      # Opt-in and deliberately last: it hashes the published installer URL,
      # which only resolves once the release is out of draft. Set the
      # WINGET_TOKEN secret to turn it on — a *classic* PAT with the
      # public_repo scope (fine-grained tokens aren't supported). The package
      # must already exist in microsoft/winget-pkgs; the first submission is
      # manual. See packaging/winget/README.md.
      #
      # wingetcreate.exe ships framework-dependent against net9.0-windows, so
      # the runtime is installed rather than assumed from the runner image.
      - name: Set up .NET for wingetcreate
        if: ${{ env.WINGET_TOKEN != '' }}
        continue-on-error: true
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      # continue-on-error: the release is already published by this point, and
      # a winget hiccup shouldn't flag the release as failed. The PR can always
      # be opened by hand.
      - name: Update winget manifest
        if: ${{ env.WINGET_TOKEN != '' }}
        continue-on-error: true
        shell: pwsh
        env:
          # Passing --token on the command line risks it being logged; the tool
          # reads this variable instead.
          WINGET_CREATE_GITHUB_TOKEN: ${{ env.WINGET_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $url = "https://github.com/x-salmon/shellby/releases/download/$tag/Shellby-Setup-$version.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update x-salmon.Shellby `
            --version $version `
            --urls "$url|x64" `
            --release-date (Get-Date -Format 'yyyy-MM-dd') `
            --release-notes-url "https://github.com/x-salmon/shellby/releases/tag/$tag" `
            --submit `
            --no-open
