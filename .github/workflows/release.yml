name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Create the draft release first. electron-builder uploads installer,
      # portable, blockmap and latest.yml in parallel, and if none exists yet
      # each upload races to create its own draft.
      - name: Create draft release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "Shellby ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md

      - name: Build and upload
        run: npx electron-builder --win --publish always

      # Publish only once every file is attached, so auto-update never sees a
      # release without latest.yml.
      - name: Publish release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
