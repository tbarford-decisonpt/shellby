version: 2
updates:
  # Runtime and dev packages. Minor and patch bumps come as one weekly PR so
  # they're cheap to review; a new major version gets a PR of its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
