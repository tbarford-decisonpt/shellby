version = 1
revision = 3
requires-python = ">=3.10"

[[package]]
name = "certifi"
version = "2026.7.22"
source = { registry = "https://pypi.org/simple" }
wheels = [
]

[[package]]
name = "chardet"
version = "3.0.4"
source = { registry = "https://pypi.org/simple" }
wheels = [
]

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = "https://pypi.org/simple" }
wheels = [
]

[[package]]
name = "dw-uv"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "jinja2" },
    { name = "requests" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "jinja2", specifier = "==3.1.6" },
    { name = "requests", specifier = "==2.19.0" },
]

[package.metadata.requires-dev]
dev = [{ name = "pytest", specifier = "==8.0.0" }]

[[package]]
name = "exceptiongroup"
version = "1.3.1"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "typing-extensions", marker = "python_full_version < '3.13'" },
]
wheels = [
]

[[package]]
name = "idna"
